RunTime:
  dump: True
  dump_path: 'runtime'
  auto_stop_cnt: -1 # never stop

Detector:
  type: "CV2"
  CvDetector:
    diff_thresh: 30
    brightness_thresh: 200
    min_area: 100
    max_area: 3000
    blur_kernel_size: 7

AirbotSegment:
  device: 'cpu'
  model_name: "MobileSAM"
  SAM:
    model_type: 'vit_b'
    checkpoint:
      vit_b:
        'checkpoint/sam_vit_b.pth'
  FastSAM:
    model_type: 'FastSAM-s'
    checkpoint:
      FastSAM-s:
        'checkpoint/FastSAM-s.pt'
      FastSAM-x:
        'checkpoint/FastSAM-x.pt'
  MobileSAM:
    model_type: 'vit_t'
    checkpoint:
      vit_t:
        'checkpoint/mobile_sam.pt'

AirbotGrasp:
  camera_type: "Realsense"
  safe_height_bias: 0.003
  grasp_depth: 0.04 # gripper in depth
  observe_pose:
    - [0.227385, 0.000541, 0.278720]
    - [-0.010554, 0.479376, -0.006724, 0.877520]
  place_pose:
    - [0.155167, 0.462692, 0.173515]
    - [-0.301532, 0.357147, 0.584357, 0.663363]
  pre_place_pose:
    - [0.365120, 0.277567, 0.155785]
    - [-0.144464, 0.408176, 0.320519, 0.842490]

AirbotYolo:
  checkpoint: 'checkpoint/yolo_best_0414.pt'
  verbose: False

ArmParams:
  port: 50051
  base_height: 0.005 # m
  gripper_width: 0.072 # m
  gripper_length: 0.078 # m
  od_arm_safe_threshold: 20 # N·m
  dm_arm_safe_threshold: 15 # N·m
  gripper_safe_threshold: 10 # N·m

